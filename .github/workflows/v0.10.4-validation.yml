name: Validate v0.10.4

on:
  push:
    branches:
      - "main"
      - "v0.10.4-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/src-tauri/target
      PROMPT_FORGE_DIST_DIR: ${{ github.workspace }}/source/dist
      PROMPT_FORGE_VITE_CACHE_DIR: ${{ github.workspace }}/source/node_modules/.vite
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri

      - name: Install frontend dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: source
        run: pnpm build

      - name: Check Rust formatting
        working-directory: source/src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: source/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run Rust tests
        working-directory: source/src-tauri
        run: cargo test --locked

      - name: Prepare Tauri NSIS utility plugin
        shell: pwsh
        run: |
          $destination = "source/src-tauri/target/.tauri/NSIS/Plugins/x86-unicode/additional"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $download = Join-Path $env:RUNNER_TEMP "nsis-tauri-utils"
          New-Item -ItemType Directory -Path $download -Force | Out-Null
          gh release download nsis_tauri_utils-v0.5.3 `
            --repo tauri-apps/nsis-tauri-utils `
            --pattern "nsis_tauri_utils.dll" `
            --dir $download `
            --clobber
          Copy-Item -LiteralPath (Join-Path $download "nsis_tauri_utils.dll") `
            -Destination (Join-Path $destination "nsis_tauri_utils.dll") `
            -Force

      - name: Build Windows release bundle
        working-directory: source
        run: pnpm tauri build --config src-tauri/tauri.ci.conf.json

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@v4
        with:
          name: prompt-forge-v0.10.4-windows-x64
          path: |
            source/src-tauri/target/release/*.exe
            source/src-tauri/target/release/*.dll
            source/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
