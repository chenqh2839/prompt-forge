name: Validate v0.10.3

on:
  push:
    branches:
      - "main"
      - "v0.10.3-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/src-tauri/target

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri

      - name: Install frontend dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: source
        run: pnpm build

      - name: Check Rust formatting
        working-directory: source/src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: source/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run Rust tests
        working-directory: source/src-tauri
        run: cargo test --locked

      - name: Build Windows release bundle
        working-directory: source
        run: pnpm tauri build --config src-tauri/tauri.ci.conf.json

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@v4
        with:
          name: prompt-forge-v0.10.3-windows-x64
          path: |
            source/src-tauri/target/release/*.exe
            source/src-tauri/target/release/*.dll
            source/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
